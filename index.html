<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maquiloco SA de CV</title>
  <style>
    /* Reset básico para que el juego ocupe todo sin scroll */
    body {
      margin: 0;
      padding: 0;
      background-color: #06121f; /* Fondo oscuro solicitado */
      overflow: hidden;
    }

    /* Contenedor del Spinner: oculto por defecto, cubre toda la pantalla */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #060f18;
      display: none; /* Se activa con JavaScript */
      justify-content: center;
      align-items: center;
      z-index: 9999; /* Siempre por encima del canvas de Phaser */
    }

    /* --- TU CSS DEL SPINNER --- */
    .neon-spinner {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .arc {
      position: absolute;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 30%, #00f3ff 90%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      filter: drop-shadow(0 0 6px #00f3ff) drop-shadow(0 0 12px #00f3ff);
    }
    .arc-1 {
      width: 120px;
      height: 120px;
      animation: spin 3s linear infinite;
    }
    .arc-2 {
      width: 90px;
      height: 90px;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      animation: spin-reverse 2.5s linear infinite;
    }
    .arc-3 {
      width: 60px;
      height: 60px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>

  <!-- Contenedor donde Phaser montará el juego -->
  <div id="juego"></div>

  <!-- El Spinner de Carga (Overlay) -->
  <div id="loading-overlay">
    <div class="neon-spinner">
      <div class="arc arc-1"></div>
      <div class="arc arc-2"></div>
      <div class="arc arc-3"></div>
    </div>
  </div>

  <!-- Tu script principal de Vite -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
